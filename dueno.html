<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tu Sueños - Dueño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --indigo-950: #1B1F3B; --indigo-800: #2A3163; --indigo-600: #3E4785;
  --lavender-50: #F3F2FA; --lavender-100: #E7E5F5; --sand-100: #FBF9F5;
  --gold-500: #C9922E; --gold-600: #B07F26;
  --sage-500: #5E8B7E; --sage-600: #4C7266;
  --state-green: #3C8F5E; --state-green-bg: #E3F3EA;
  --state-yellow: #B8801E; --state-yellow-bg: #FBF0DC;
  --state-red: #C0463F; --state-red-bg: #FBE8E7;
  --text-main: #23263B; --text-muted: #6B6E85; --border-soft: #E3E1EE;
  --radius-card: 14px; --radius-control: 10px;
  --shadow-card: 0 1px 3px rgba(27, 31, 59, 0.08), 0 6px 16px rgba(27, 31, 59, 0.05);
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--lavender-50); color: var(--text-main); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

.btn { border: none; border-radius: var(--radius-control); padding: 13px 18px; font-size: 15px; font-weight: 600; transition: transform 0.08s ease; }
.btn:active { transform: scale(0.98); }
.btn-block { width: 100%; }
.btn-approve { background: var(--state-green); color: #fff; }
.btn-reject { background: var(--state-red); color: #fff; }
.btn-small { padding: 9px 14px; font-size: 13.5px; border-radius: 8px; }

#loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--indigo-950); color: #fff; font-size: 14px; text-align: center; padding: 24px; }

.topbar { position: sticky; top: 0; z-index: 20; background: var(--indigo-950); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
.topbar-title { display: flex; flex-direction: column; line-height: 1.15; }
.brand-small { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: #fff; }
.topbar-location { font-size: 12px; color: var(--lavender-100); opacity: 0.85; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.user-name { font-size: 13px; color: var(--lavender-100); }
.btn-ghost { background: transparent; color: #fff; font-weight: 500; padding: 6px 10px; border: none; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: #fff; border-top: 1px solid var(--border-soft); display: flex; justify-content: space-around; padding: 6px 2px calc(6px + env(safe-area-inset-bottom)); }
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-muted); padding: 6px 4px; flex: 1; position: relative; }
.nav-btn.active { color: var(--indigo-950); font-weight: 600; }
.nav-icon { font-size: 20px; }
.badge { position: absolute; top: 0; right: 12%; background: var(--state-red); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

.content { padding: 16px 16px calc(90px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
.section-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 22px 0 10px; color: var(--indigo-950); }
.section-title:first-child { margin-top: 4px; }

.locales-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.locale-card { background: #fff; border-radius: var(--radius-card); padding: 16px; box-shadow: var(--shadow-card); cursor: pointer; border-left: 4px solid var(--gold-500); }
.locale-card h3 { margin: 0 0 4px; font-size: 15px; color: var(--indigo-950); }
.locale-card .locale-count { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.locale-card .locale-sub { font-size: 12px; color: var(--text-muted); }

.ventas-mes-card { background: linear-gradient(135deg, var(--indigo-950), var(--indigo-600)); border-radius: var(--radius-card); padding: 14px 18px; color: #fff; }
.ventas-mes-top { display: flex; justify-content: space-between; align-items: center; }
.ventas-mes-label { font-size: 12px; opacity: 0.85; }
.ventas-mes-valor { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.ventas-mes-breakdown { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; opacity: 0.9; flex-wrap: wrap; }
.section-title-row { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; gap: 10px; }
.section-title-row .section-title { margin: 0; }
.section-title-row select { padding: 8px 10px; border-radius: var(--radius-control); border: 1.5px solid var(--border-soft); background: #fff; font-size: 13px; font-weight: 600; color: var(--indigo-950); }
.local-venta-row { display: flex; justify-content: space-between; align-items: center; }
.local-venta-row .local-venta-monto { font-family: var(--font-display); font-weight: 600; color: var(--indigo-950); }

.search-bar { margin-bottom: 12px; }
.search-bar input, .filters-bar input, .filters-bar select { width: 100%; padding: 12px 14px; border-radius: var(--radius-control); border: 1.5px solid var(--border-soft); background: #fff; font-size: 14.5px; }
.filters-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.filters-bar input[type="text"], .filters-bar input[type="date"] { grid-column: span 2; }

.locale-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
.locale-tab-btn { white-space: nowrap; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border-soft); background: #fff; color: var(--text-muted); font-size: 13.5px; font-weight: 600; }
.locale-tab-btn.active { background: var(--indigo-950); border-color: var(--indigo-950); color: #fff; }

.product-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.product-card { background: #fff; border-radius: var(--radius-card); padding: 16px; box-shadow: var(--shadow-card); }
.product-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.product-card h4 { margin: 0; font-size: 15.5px; color: var(--indigo-950); font-weight: 600; }
.product-card .product-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.product-card .product-stock { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--indigo-950); white-space: nowrap; }
.product-card .product-stock.stock-zero { color: var(--state-red); }

.movement-list { display: flex; flex-direction: column; gap: 10px; }
.empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 28px 10px; }
.movement-card { background: #fff; border-radius: var(--radius-card); padding: 14px 16px; box-shadow: var(--shadow-card); border-left: 4px solid var(--border-soft); }
.movement-card.estado-pendiente { border-left-color: var(--state-yellow); }
.movement-card.estado-aprobada { border-left-color: var(--state-green); }
.movement-card.estado-rechazada { border-left-color: var(--state-red); }
.movement-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.movement-title { font-weight: 600; font-size: 14.5px; color: var(--indigo-950); }
.movement-detail { font-size: 13px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.movement-actions { display: flex; gap: 8px; margin-top: 12px; }
.pill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.pill-pendiente { background: var(--state-yellow-bg); color: var(--state-yellow); }
.pill-aprobada { background: var(--state-green-bg); color: var(--state-green); }
.pill-rechazada { background: var(--state-red-bg); color: var(--state-red); }

.toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: var(--indigo-950); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 13.5px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.25); max-width: 90vw; text-align: center; }
.toast.toast-error { background: var(--state-red); }
.toast.toast-success { background: var(--state-green); }

@media (min-width: 640px) {
  .locales-grid { grid-template-columns: repeat(4, 1fr); }
  .bottom-nav { max-width: 720px; left: 50%; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
}
</style>
</head>
<body>

<div id="loading-screen">Cargando...</div>
<div id="toast" class="toast hidden"></div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-small">Tu Sueños</span>
      <span class="topbar-location">Dueño</span>
    </div>
    <div class="topbar-actions">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn-ghost">Salir</button>
    </div>
  </header>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="view-dashboard"><span class="nav-icon">🏠</span><span>Inicio</span></button>
    <button class="nav-btn" data-view="view-stock"><span class="nav-icon">📦</span><span>Stock</span></button>
    <button class="nav-btn" data-view="view-envios"><span class="nav-icon">🚚</span><span>Envíos</span><span id="envios-badge" class="badge hidden">0</span></button>
    <button class="nav-btn" data-view="view-history"><span class="nav-icon">📋</span><span>Historial</span></button>
  </nav>

  <main class="content">

    <section id="view-dashboard" class="view">
      <div class="section-title-row">
        <h2 class="section-title">Ventas por local</h2>
        <select id="ventas-mes-select"></select>
      </div>
      <div id="ventas-por-local-total" class="ventas-mes-card"></div>
      <div id="ventas-por-local-list" class="movement-list" style="margin-top:10px;"></div>

      <h2 class="section-title">Locales</h2>
      <div class="locales-grid" id="locales-grid"></div>

      <h2 class="section-title">Últimos movimientos</h2>
      <div id="recent-movements" class="movement-list"></div>
    </section>

    <section id="view-stock" class="view hidden">
      <div class="search-bar"><input type="text" id="search-input" placeholder="🔍 Buscar producto..."></div>
      <div id="locale-tabs" class="locale-tabs"></div>
      <div id="stock-list" class="product-grid"></div>
    </section>

    <section id="view-envios" class="view hidden">
      <h2 class="section-title" style="margin-top:0;">Para aprobar</h2>
      <div id="envios-para-aprobar" class="movement-list"></div>

      <h2 class="section-title">Esperando que el admin confirme la venta</h2>
      <div id="envios-esperando-admin" class="movement-list"></div>
    </section>

    <section id="view-history" class="view hidden">
      <div class="filters-bar">
        <select id="filter-local"><option value="">Todos los locales</option></select>
        <select id="filter-tipo">
          <option value="">Todos los tipos</option>
          <option value="venta">Ventas</option>
          <option value="transferencia">Transferencias</option>
          <option value="entrada">Entradas</option>
          <option value="ajuste">Ajustes</option>
        </select>
        <select id="filter-estado">
          <option value="">Todos los estados</option>
          <option value="aprobada">Aprobado</option>
          <option value="pendiente">Pendiente</option>
          <option value="rechazada">Rechazado</option>
        </select>
        <input type="text" id="filter-producto" placeholder="Filtrar por producto...">
        <input type="date" id="filter-fecha">
      </div>
      <div id="history-list" class="movement-list"></div>
    </section>

  </main>
</div>

<!-- ============ SDKs de Firebase (compat, vía CDN) ============ -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
// ==========================================================
// CONFIGURACIÓN DE FIREBASE
// ==========================================================
const firebaseConfig = {
  apiKey: "AIzaSyDn7qYymsn3Rd7F3UkL0xNaotQNbbCrwUw",
  authDomain: "tusuenoscolchones.firebaseapp.com",
  projectId: "tusuenoscolchones",
  storageBucket: "tusuenoscolchones.firebasestorage.app",
  messagingSenderId: "286720480102",
  appId: "1:286720480102:web:162a56256e4be40cc0aea7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const LOCALES = { local1: "Local 1", local2: "Local 2", local3: "Local 3", local4: "Local 4" };
const FORMAS_PAGO = { contado: "De contado", transferencia: "Transferencia", debito: "Débito", credito: "Crédito", otro: "Otro" };
function categoriaFormaPago(formaPago) {
  if (formaPago === "contado") return "efectivo";
  if (formaPago === "debito" || formaPago === "credito") return "tarjeta";
  return "otro";
}

// ==========================================================
// ESTADO GLOBAL Y UTILIDADES
// ==========================================================
let currentUser = null; // { uid, nombre }
const cache = { products: {}, stock: {}, sales: {}, movements: [] };
let unsubscribers = [];
let activeStockLocaleTab = null;
let movementsErrorHtml = null;

const $ = (id) => document.getElementById(id);

function showToast(message, type = "") {
  const toast = $("toast");
  toast.textContent = message;
  toast.className = "toast" + (type ? " toast-" + type : "");
  toast.classList.remove("hidden");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.add("hidden"), 3200);
}

function formatFechaHora(timestamp) {
  if (!timestamp) return "";
  const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function formatMoney(v) {
  if (v === undefined || v === null || isNaN(v)) return "";
  return "$" + Number(v).toLocaleString("es-AR");
}

function stockKey(localId, productId) { return `${localId}_${productId}`; }
function getStockCantidad(localId, productId) {
  const doc = cache.stock[stockKey(localId, productId)];
  return doc ? doc.cantidad : 0;
}
function productosActivos() {
  return Object.entries(cache.products).filter(([, p]) => p.activo !== false).sort((a, b) => a[1].nombre.localeCompare(b[1].nombre));
}
function monthKeyOf(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`; }

// ==========================================================
// AUTENTICACIÓN — esta página es exclusiva para rol "dueno"
// ==========================================================
$("logout-btn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(async (user) => {
  cleanupListeners();
  if (!user) { window.location.href = "login.html"; return; }
  try {
    const userDoc = await db.collection("users").doc(user.uid).get();
    if (!userDoc.exists) {
      $("loading-screen").textContent = "Tu usuario no tiene perfil configurado en Firestore. Volviendo al login...";
      await auth.signOut();
      setTimeout(() => (window.location.href = "login.html"), 2500);
      return;
    }
    const data = userDoc.data();
    if (data.activo === false) {
      $("loading-screen").textContent = "Tu usuario está desactivado. Volviendo al login...";
      await auth.signOut();
      setTimeout(() => (window.location.href = "login.html"), 2500);
      return;
    }
    const rol = (data.rol || "").trim().toLowerCase();
    if (rol !== "dueno") {
      if (rol === "admin") { window.location.href = "admin.html"; return; }
      if (rol === "local") { window.location.href = "usuario.html"; return; }
      $("loading-screen").textContent = 'Tu usuario no tiene un rol válido. Volviendo al login...';
      await auth.signOut();
      setTimeout(() => (window.location.href = "login.html"), 2500);
      return;
    }

    currentUser = { uid: user.uid, nombre: data.nombre || user.email };
    $("loading-screen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("user-name").textContent = currentUser.nombre;

    generarOpcionesMeses();
    populateFilterLocal();
    startListeners();
  } catch (err) {
    console.error(err);
    $("loading-screen").textContent = "No se pudo leer tu perfil (revisá las reglas de Firestore). Detalle: " + (err.message || err.code || "desconocido");
    showToast("Error al cargar tu perfil.", "error");
  }
});

function cleanupListeners() { unsubscribers.forEach((u) => u()); unsubscribers = []; }

function populateFilterLocal() {
  const filterLocal = $("filter-local");
  filterLocal.innerHTML = '<option value="">Todos los locales</option>';
  Object.entries(LOCALES).forEach(([id, nombre]) => (filterLocal.innerHTML += `<option value="${id}">${nombre}</option>`));
}

function generarOpcionesMeses() {
  const select = $("ventas-mes-select");
  const now = new Date();
  let html = "";
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = monthKeyOf(d);
    let label = d.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
    label = label.charAt(0).toUpperCase() + label.slice(1);
    html += `<option value="${key}">${label}</option>`;
  }
  select.innerHTML = html;
  select.addEventListener("change", renderVentasPorLocal);
}

// ==========================================================
// LISTENERS EN TIEMPO REAL (el dueño lee todo, no escribe stock/productos)
// ==========================================================
function startListeners() {
  unsubscribers.push(db.collection("products").onSnapshot((snap) => {
    cache.products = {};
    snap.forEach((doc) => (cache.products[doc.id] = doc.data()));
    renderAll();
  }));

  unsubscribers.push(db.collection("stock").onSnapshot((snap) => {
    cache.stock = {};
    snap.forEach((doc) => (cache.stock[doc.id] = doc.data()));
    renderAll();
  }));

  // Todas las ventas (para la sección de Envíos, que necesita ver las pendientes).
  unsubscribers.push(db.collection("sales").onSnapshot((snap) => {
    cache.sales = {};
    snap.forEach((doc) => (cache.sales[doc.id] = doc.data()));
    renderAll();
  }));

  unsubscribers.push(
    db.collection("movements").orderBy("fecha", "desc").limit(200).onSnapshot(
      (snap) => { cache.movements = snap.docs.map((d) => ({ id: d.id, ...d.data() })); renderAll(); },
      (err) => { console.error("movements listener:", err); mostrarErrorHistorial(err); }
    )
  );
}

function mostrarErrorHistorial(err) {
  const match = (err.message || "").match(/https:\/\/[^\s]+/);
  if (match) {
    movementsErrorHtml = `<div class="empty-state">
      No se pudo cargar el historial: a Firestore le falta un índice.<br><br>
      <a href="${match[0]}" target="_blank" style="color:var(--indigo-950); font-weight:600;">Tocá acá para crearlo automáticamente</a><br><br>
      Después de crearlo (tarda 1-2 minutos), volvé a entrar a la app.
    </div>`;
  } else {
    movementsErrorHtml = `<div class="empty-state">No se pudo cargar el historial (${err.code || err.message || "error desconocido"}).</div>`;
  }
  $("history-list").innerHTML = movementsErrorHtml;
}

function renderAll() {
  if (!currentUser) return;
  renderVentasPorLocal();
  renderDashboardExtras();
  renderStockView();
  renderEnviosView();
  renderHistoryView();
  updateEnviosBadge();
}

// ==========================================================
// NAVEGACIÓN
// ==========================================================
document.querySelectorAll(".nav-btn").forEach((btn) => btn.addEventListener("click", () => goToView(btn.dataset.view)));
function goToView(viewId) {
  document.querySelectorAll(".view").forEach((v) => v.classList.add("hidden"));
  $(viewId).classList.remove("hidden");
  document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === viewId));
}

function contarEnviosParaAprobar() {
  return Object.values(cache.sales).filter((s) => s.estado === "pendiente" && s.entrega === "si" && s.estadoEntrega === "pendiente").length;
}
function updateEnviosBadge() {
  const count = contarEnviosParaAprobar();
  const badge = $("envios-badge");
  if (count > 0) { badge.textContent = count; badge.classList.remove("hidden"); } else badge.classList.add("hidden");
}

// ==========================================================
// DASHBOARD: VENTAS POR LOCAL + LOCALES + ÚLTIMOS MOVIMIENTOS
// ==========================================================
function renderVentasPorLocal() {
  const mesKey = $("ventas-mes-select").value || monthKeyOf(new Date());
  const totales = {};
  Object.keys(LOCALES).forEach((id) => (totales[id] = { total: 0, efectivo: 0, tarjeta: 0, otro: 0 }));
  const totalGeneral = { total: 0, efectivo: 0, tarjeta: 0, otro: 0 };

  cache.movements.forEach((m) => {
    if (m.tipo !== "venta" || m.estado !== "aprobada") return;
    const precio = Number(m.precio);
    const cantidad = Number(m.cantidad);
    if (isNaN(precio) || isNaN(cantidad)) return;
    const d = m.fecha?.toDate ? m.fecha.toDate() : (m.fecha ? new Date(m.fecha) : null);
    if (!d || monthKeyOf(d) !== mesKey) return;
    const monto = precio * cantidad;
    const categoria = categoriaFormaPago(m.formaPago);
    const localVendedor = m.localVendedor || m.localId;
    if (!totales[localVendedor]) totales[localVendedor] = { total: 0, efectivo: 0, tarjeta: 0, otro: 0 };
    totales[localVendedor].total += monto;
    totales[localVendedor][categoria] += monto;
    totalGeneral.total += monto;
    totalGeneral[categoria] += monto;
  });

  const mesLabel = $("ventas-mes-select").selectedOptions[0]?.textContent || "";
  $("ventas-por-local-total").innerHTML = `
    <div class="ventas-mes-top">
      <span class="ventas-mes-label">Total vendido en ${mesLabel}</span>
      <span class="ventas-mes-valor">${formatMoney(totalGeneral.total)}</span>
    </div>
    <div class="ventas-mes-breakdown">
      <span>Efectivo: ${formatMoney(totalGeneral.efectivo)}</span>
      <span>Tarjeta: ${formatMoney(totalGeneral.tarjeta)}</span>
      ${totalGeneral.otro ? `<span>Otro: ${formatMoney(totalGeneral.otro)}</span>` : ""}
    </div>
  `;

  $("ventas-por-local-list").innerHTML = Object.entries(LOCALES).map(([id, nombre]) => `
    <div class="movement-card">
      <div class="local-venta-row"><span class="movement-title">${nombre}</span><span class="local-venta-monto">${formatMoney(totales[id].total)}</span></div>
      <div class="ventas-mes-breakdown" style="color:var(--text-muted); margin-top:6px;">
        <span>Efectivo: ${formatMoney(totales[id].efectivo)}</span>
        <span>Tarjeta: ${formatMoney(totales[id].tarjeta)}</span>
        ${totales[id].otro ? `<span>Otro: ${formatMoney(totales[id].otro)}</span>` : ""}
      </div>
    </div>`).join("");
}

function renderDashboardExtras() {
  $("locales-grid").innerHTML = Object.entries(LOCALES).map(([id, nombre]) => {
    const total = productosActivos().reduce((sum, [pid]) => sum + getStockCantidad(id, pid), 0);
    return `<div class="locale-card" data-locale="${id}"><h3>${nombre}</h3><span class="locale-count">${total}</span><div class="locale-sub">unidades en stock</div></div>`;
  }).join("");

  document.querySelectorAll(".locale-card").forEach((el) => el.addEventListener("click", () => {
    activeStockLocaleTab = el.dataset.locale;
    goToView("view-stock");
    renderStockView();
  }));

  $("recent-movements").innerHTML = cache.movements.slice(0, 6).map(renderMovementCard).join("") || `<div class="empty-state">Todavía no hay movimientos registrados.</div>`;
}

// ==========================================================
// STOCK (solo lectura)
// ==========================================================
function renderStockView() {
  if (!activeStockLocaleTab) activeStockLocaleTab = Object.keys(LOCALES)[0];
  $("locale-tabs").innerHTML = Object.entries(LOCALES)
    .map(([id, nombre]) => `<button class="locale-tab-btn ${id === activeStockLocaleTab ? "active" : ""}" data-locale="${id}">${nombre}</button>`).join("");
  document.querySelectorAll(".locale-tab-btn").forEach((btn) => btn.addEventListener("click", () => { activeStockLocaleTab = btn.dataset.locale; renderStockView(); }));

  const localId = activeStockLocaleTab;
  const query = $("search-input").value.trim().toLowerCase();
  const list = productosActivos().filter(([, p]) => !query || [p.nombre, p.medida, p.categoria, p.color].join(" ").toLowerCase().includes(query));

  $("stock-list").innerHTML = list.map(([pid, p]) => {
    const cantidad = getStockCantidad(localId, pid);
    const zeroClass = cantidad === 0 ? "stock-zero" : "";
    const metaTxt = [p.categoria, p.medida, p.color ? `Color: ${p.color}` : null, p.precio ? formatMoney(p.precio) : null].filter(Boolean).join(" · ");
    return `<div class="product-card">
      <div class="product-card-top">
        <div><h4>${p.nombre}</h4><div class="product-meta">${metaTxt}</div></div>
        <div class="product-stock ${zeroClass}">${cantidad}</div>
      </div>
    </div>`;
  }).join("") || `<div class="empty-state">No se encontraron productos.</div>`;
}
$("search-input").addEventListener("input", renderStockView);

// ==========================================================
// ENVÍOS: el dueño aprueba/rechaza el ENVÍO (no la venta en sí)
// ==========================================================
function detalleEntregaTxt(item) {
  let txt = "";
  if (item.color) txt += `Color: ${item.color}<br>`;
  txt += `🚚 Entregar a: ${item.entregaNombre} (${item.entregaTelefono})<br>${item.entregaCalle} ${item.entregaNumero}<br>`;
  return txt;
}

function renderEnviosView() {
  const paraAprobar = Object.entries(cache.sales)
    .filter(([, s]) => s.estado === "pendiente" && s.entrega === "si" && s.estadoEntrega === "pendiente")
    .map(([id, s]) => ({ id, ...s }))
    .sort((a, b) => (b.fechaCreacion?.seconds || 0) - (a.fechaCreacion?.seconds || 0));

  $("envios-para-aprobar").innerHTML = paraAprobar.map((item) => {
    const producto = cache.products[item.productId]?.nombre || item.productNombre || "Producto";
    const precioTxt = item.precio !== undefined ? ` · ${formatMoney(item.precio)} c/u` : "";
    return `<div class="movement-card estado-pendiente">
      <div class="movement-top"><span class="movement-title">${LOCALES[item.localId]} · ${producto} x${item.cantidad}${precioTxt}</span><span class="pill pill-pendiente">Pendiente</span></div>
      <div class="movement-detail">Vendedor: ${item.usuarioNombre}<br>${detalleEntregaTxt(item)}${formatFechaHora(item.fechaCreacion)}</div>
      <div class="movement-actions">
        <button class="btn btn-approve btn-small btn-aprobar-envio" data-id="${item.id}">Aprobar envío</button>
        <button class="btn btn-reject btn-small btn-rechazar-envio" data-id="${item.id}">Rechazar envío</button>
      </div>
    </div>`;
  }).join("") || `<div class="empty-state">No hay envíos esperando aprobación.</div>`;

  const esperandoAdmin = Object.entries(cache.sales)
    .filter(([, s]) => s.estado === "pendiente" && s.entrega === "si" && s.estadoEntrega === "aprobado")
    .map(([id, s]) => ({ id, ...s }))
    .sort((a, b) => (b.fechaCreacion?.seconds || 0) - (a.fechaCreacion?.seconds || 0));

  $("envios-esperando-admin").innerHTML = esperandoAdmin.map((item) => {
    const producto = cache.products[item.productId]?.nombre || item.productNombre || "Producto";
    return `<div class="movement-card estado-aprobada">
      <div class="movement-top"><span class="movement-title">${LOCALES[item.localId]} · ${producto} x${item.cantidad}</span><span class="pill pill-aprobada">Envío OK</span></div>
      <div class="movement-detail">Vendedor: ${item.usuarioNombre}<br>${detalleEntregaTxt(item)}${formatFechaHora(item.fechaCreacion)}</div>
    </div>`;
  }).join("") || `<div class="empty-state">No hay envíos esperando confirmación del admin.</div>`;

  document.querySelectorAll(".btn-aprobar-envio").forEach((btn) => (btn.onclick = () => handleAprobarEnvio(btn.dataset.id)));
  document.querySelectorAll(".btn-rechazar-envio").forEach((btn) => (btn.onclick = () => handleRechazarEnvio(btn.dataset.id)));
}

async function handleAprobarEnvio(saleId) {
  try {
    const saleRef = db.collection("sales").doc(saleId);
    await db.runTransaction(async (tx) => {
      const saleDoc = await tx.get(saleRef);
      if (!saleDoc.exists || saleDoc.data().estado !== "pendiente") throw new Error("Esta venta ya fue procesada.");
      tx.update(saleRef, {
        estadoEntrega: "aprobado",
        entregaAprobadoPorUid: currentUser.uid,
        entregaAprobadoPorNombre: currentUser.nombre,
        entregaFechaAprobacion: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    showToast("Envío aprobado. Ahora el admin puede confirmar la venta.", "success");
  } catch (err) {
    console.error(err);
    showToast(err.message || "No se pudo aprobar el envío.", "error");
  }
}

async function handleRechazarEnvio(saleId) {
  try {
    const saleRef = db.collection("sales").doc(saleId);
    const movementRef = db.collection("movements").doc();
    await db.runTransaction(async (tx) => {
      const saleDoc = await tx.get(saleRef);
      if (!saleDoc.exists || saleDoc.data().estado !== "pendiente") throw new Error("Esta venta ya fue procesada.");
      const sale = saleDoc.data();
      tx.update(saleRef, {
        estado: "rechazada", estadoEntrega: "rechazado",
        aprobadoPorUid: currentUser.uid, aprobadoPorNombre: currentUser.nombre,
        fechaResolucion: firebase.firestore.FieldValue.serverTimestamp()
      });
      tx.set(movementRef, {
        tipo: "venta", productId: sale.productId, productNombre: sale.productNombre, cantidad: sale.cantidad, localId: sale.localId,
        usuarioNombre: sale.usuarioNombre, administradorNombre: currentUser.nombre, estado: "rechazada",
        precio: sale.precio ?? null, formaPago: sale.formaPago ?? null, grupoVentaId: sale.grupoVentaId ?? null, localVendedor: sale.localVendedor ?? null,
        color: sale.color ?? null, entrega: sale.entrega ?? null, entregaNombre: sale.entregaNombre ?? null, entregaTelefono: sale.entregaTelefono ?? null,
        entregaCalle: sale.entregaCalle ?? null, entregaNumero: sale.entregaNumero ?? null,
        fecha: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    showToast("Envío rechazado.", "success");
  } catch (err) {
    console.error(err);
    showToast(err.message || "No se pudo rechazar el envío.", "error");
  }
}

// ==========================================================
// HISTORIAL (solo lectura)
// ==========================================================
["filter-local", "filter-tipo", "filter-estado", "filter-producto", "filter-fecha"].forEach((id) => $(id).addEventListener("input", renderHistoryView));

function detalleEntregaHistorialTxt(item) {
  let txt = "";
  if (item.color) txt += `Color: ${item.color}<br>`;
  if (item.entrega === "si") {
    txt += `🚚 Entregar a: ${item.entregaNombre} (${item.entregaTelefono})<br>${item.entregaCalle} ${item.entregaNumero}<br>`;
  } else if (item.entrega === "no") {
    txt += `Retira del local<br>`;
  }
  return txt;
}

function renderMovementCard(m) {
  const producto = cache.products[m.productId]?.nombre || m.productNombre || "Producto";
  let titulo = "";
  if (m.tipo === "venta") {
    const cruzada = m.localVendedor && m.localId && m.localVendedor !== m.localId;
    titulo = cruzada ? `Venta · 🔀 ${LOCALES[m.localVendedor]} vendió stock de ${LOCALES[m.localId]} · ${producto} x${m.cantidad}` : `Venta · ${LOCALES[m.localId]} · ${producto} x${m.cantidad}`;
  }
  else if (m.tipo === "transferencia") titulo = `Transferencia · ${LOCALES[m.localId]} → ${LOCALES[m.localDestino]} · ${producto} x${m.cantidad}`;
  else if (m.tipo === "entrada") titulo = `Entrada · ${LOCALES[m.localId]} · ${producto} x${m.cantidad}`;
  else if (m.tipo === "ajuste") titulo = `Ajuste manual · ${LOCALES[m.localId]} · ${producto}`;

  const precioTxt = m.tipo === "venta" && m.precio !== null && m.precio !== undefined && !isNaN(Number(m.precio))
    ? `Precio: ${formatMoney(Number(m.precio))} c/u (total ${formatMoney(Number(m.precio) * Number(m.cantidad))})<br>` : "";
  const pagoTxt = m.tipo === "venta" && m.formaPago ? `Forma de pago: ${FORMAS_PAGO[m.formaPago] || m.formaPago}<br>` : "";
  const entregaTxt = m.tipo === "venta" ? detalleEntregaHistorialTxt(m) : "";

  const detalle = `${m.usuarioNombre ? "Usuario: " + m.usuarioNombre + "<br>" : ""}${m.administradorNombre ? "Admin: " + m.administradorNombre + "<br>" : ""}${precioTxt}${pagoTxt}${entregaTxt}${m.stockAntes !== undefined ? `Stock: ${m.stockAntes} → ${m.stockDespues}<br>` : ""}${formatFechaHora(m.fecha)}`;
  const estadoClass = m.estado ? `estado-${m.estado}` : "";
  const pillClass = m.estado ? `pill-${m.estado}` : "pill-aprobada";
  const pillText = m.estado === "pendiente" ? "Pendiente" : m.estado === "rechazada" ? "Rechazado" : "Aprobado";

  return `<div class="movement-card ${estadoClass}">
    <div class="movement-top"><span class="movement-title">${titulo}</span><span class="pill ${pillClass}">${pillText}</span></div>
    <div class="movement-detail">${detalle}</div>
  </div>`;
}

function renderHistoryView() {
  if (movementsErrorHtml) { $("history-list").innerHTML = movementsErrorHtml; return; }

  const fLocal = $("filter-local").value, fTipo = $("filter-tipo").value, fEstado = $("filter-estado").value;
  const fProducto = $("filter-producto").value.trim().toLowerCase(), fFecha = $("filter-fecha").value;

  const filtered = cache.movements.filter((m) => {
    if (fLocal && m.localId !== fLocal) return false;
    if (fTipo && m.tipo !== fTipo) return false;
    if (fEstado && (m.estado || "aprobada") !== fEstado) return false;
    if (fProducto) {
      const nombre = (cache.products[m.productId]?.nombre || m.productNombre || "").toLowerCase();
      if (!nombre.includes(fProducto)) return false;
    }
    if (fFecha && m.fecha) {
      const d = m.fecha.toDate ? m.fecha.toDate() : new Date(m.fecha);
      if (d.toISOString().slice(0, 10) !== fFecha) return false;
    }
    return true;
  });
  $("history-list").innerHTML = filtered.map(renderMovementCard).join("") || `<div class="empty-state">No hay movimientos con esos filtros.</div>`;
}
</script>
